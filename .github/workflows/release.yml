name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to push as docker tag (e.g. 0.1.3)"
        required: true

permissions:
  contents: write
  packages: write

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web-ui/package-lock.json

      - name: Build web-ui
        working-directory: web-ui
        run: |
          npm ci
          npm run build

      - name: Copy dist into embed dir
        run: |
          rm -rf internal/web/dist
          cp -r web-ui/dist internal/web/dist

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"

      - name: Test
        run: go test ./...

      - name: Build linux binaries
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o searchmiddleware-linux-amd64 ./cmd/server
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o searchmiddleware-linux-arm64 ./cmd/server

      - uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: |
            searchmiddleware-linux-amd64
            searchmiddleware-linux-arm64
          retention-days: 1

  release:
    needs: test-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: linux-binaries
          path: dist-bin

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-bin/searchmiddleware-linux-amd64
            dist-bin/searchmiddleware-linux-arm64

  docker:
    needs: test-build
    runs-on: ubuntu-latest
    env:
      DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
      DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: linux-binaries
          path: .

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login Docker Hub
        if: ${{ env.DH_USER != '' && env.DH_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute docker tags
        id: tags
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/riverisagame/searchmiddleware:${{ steps.tags.outputs.version }}
            ghcr.io/riverisagame/searchmiddleware:latest

      - name: Build and push to Docker Hub
        if: ${{ env.DH_USER != '' && env.DH_TOKEN != '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            docker.io/dockerdoo/searchmiddleware:${{ steps.tags.outputs.version }}
            docker.io/dockerdoo/searchmiddleware:latest
