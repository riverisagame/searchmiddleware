# 搜索测试页验证索引（sm_test，对应 Zinc 中的测试数据）
source:
  name: sm_test_source
  datasource: main
  sql_query: "SELECT 1 AS id, '' AS name, 0 AS price, '' AS category_ids"
index:
  name: sm_test
  alias: true
  datasource: main
  analyzer: jieba_std
  search_analyzer: jieba_search
  boost:
    name: 5.0
  fields:
    name: { type: text, searchable: true }
    price: { type: float, sortable: true, agg: true }
    category_ids: { type: keyword, element_type: long, filter: true, agg: true }
